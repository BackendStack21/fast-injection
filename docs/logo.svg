<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Main gradient for the container -->
    <linearGradient id="containerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <!-- Glow gradient -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    
    <!-- Arrow/injection gradient -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    
    <!-- Inner glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle (subtle) -->
  <circle cx="60" cy="60" r="55" fill="url(#containerGradient)" opacity="0.1"/>
  
  <!-- Main container shape - hexagonal/rounded box representing the DI container -->
  <g filter="url(#shadow)">
    <!-- Outer container ring -->
    <rect x="20" y="25" width="80" height="70" rx="12" ry="12" 
          fill="none" stroke="url(#containerGradient)" stroke-width="3"/>
    
    <!-- Inner container fill -->
    <rect x="25" y="30" width="70" height="60" rx="8" ry="8" 
          fill="url(#containerGradient)" opacity="0.15"/>
  </g>
  
  <!-- Injection arrow - representing dependency injection -->
  <g filter="url(#glow)">
    <!-- Main injection line -->
    <path d="M8 60 L35 60" stroke="url(#arrowGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Arrow head -->
    <path d="M30 52 L40 60 L30 68" stroke="url(#arrowGradient)" stroke-width="4" 
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Connected nodes representing dependencies -->
  <g>
    <!-- Central node -->
    <circle cx="60" cy="60" r="10" fill="url(#containerGradient)" filter="url(#glow)"/>
    <circle cx="60" cy="60" r="5" fill="white" opacity="0.9"/>
    
    <!-- Top node -->
    <circle cx="60" cy="40" r="7" fill="url(#glowGradient)"/>
    <circle cx="60" cy="40" r="3" fill="white" opacity="0.9"/>
    
    <!-- Bottom left node -->
    <circle cx="45" cy="75" r="7" fill="url(#glowGradient)"/>
    <circle cx="45" cy="75" r="3" fill="white" opacity="0.9"/>
    
    <!-- Bottom right node -->
    <circle cx="75" cy="75" r="7" fill="url(#glowGradient)"/>
    <circle cx="75" cy="75" r="3" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Connection lines between nodes -->
  <g stroke="url(#glowGradient)" stroke-width="2" opacity="0.6">
    <line x1="60" y1="50" x2="60" y2="47"/>
    <line x1="52" y1="66" x2="48" y2="70"/>
    <line x1="68" y1="66" x2="72" y2="70"/>
  </g>
  
  <!-- Speed lines representing "fast" -->
  <g stroke="url(#arrowGradient)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="85" y1="45" x2="100" y2="45"/>
    <line x1="88" y1="55" x2="105" y2="55"/>
    <line x1="85" y1="65" x2="100" y2="65"/>
  </g>
  
  <!-- Lightning bolt accent for speed -->
  <path d="M95 35 L90 48 L96 48 L91 62" stroke="#fbbf24" stroke-width="2.5" 
        stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
</svg>
